services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shroyash
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data:rw
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      retries: 10
      timeout: 5s
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1"]
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 30s

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
      - "5001:5001"
    environment:
      SERVER_PORT: 8761
    command: >
      java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5001
      -jar /app/discovery-server-0.0.1-SNAPSHOT.jar
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      retries: 10
      timeout: 5s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8001:8001"
      - "5002:5002"
    environment:
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVER_PORT: 8001
    command: >
      java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5002
      -jar /app/api-gateway-0.0.1-SNAPSHOT.jar
    depends_on:
      discovery-server:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8003:8003"
      - "5005:5005"
    volumes:
      - ./auth-service/uploads:/app/uploads:rw
    environment:
      # ✅ ADDED currentSchema=public
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_service_db?currentSchema=public
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: shroyash
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8003
    command: >
      java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      -jar /app/auth-service-0.0.1-SNAPSHOT.jar
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  healthcare-service:
    build: ./healthcare-service
    container_name: healthcare-service
    ports:
      - "8004:8004"
      - "5003:5003"
    volumes:
      - ./healthcarecare-service/uploads:/app/uploads:rw
    environment:
      # ✅ ADDED currentSchema=public
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/healthcare_service_db?currentSchema=public
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: shroyash
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8004
    command: >
      java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5003
      -jar /app/healthcare-service-0.0.1-SNAPSHOT.jar
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  communication-service:
    build: ./communication-service
    container_name: communication-service
    ports:
      - "8006:8006"
      - "5007:5007"
    volumes:
      - ./communication-service/uploads:/app/uploads:rw
    environment:
      # ✅ ADDED currentSchema=public
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/communication_service_db?currentSchema=public
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: shroyash
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8006
    command: >
      java -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
      -jar /app/communication-service-0.0.1-SNAPSHOT.jar
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  auth_db_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
